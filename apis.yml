aid: akia
name: Akia
description: 'Akia (The Akia Syndicate) is a San Francisco based hospitality technology
  company whose AI agent platform automates the guest lifecycle for hotels and vacation
  rentals — guest messaging over SMS/WhatsApp/web chat, an AI voice agent, digital
  check-in and pre-registration through Mini Apps, guidebooks, upsells, tipping, tasks,
  team chat, keyless entry, surveys, reputation management and marketing campaigns.
  Akia synchronizes with more than fifty property management, smart-lock, payment and
  operations systems (Opera, Mews, Cloudbeds, Apaleo, StayNTouch, Track, Guesty,
  RemoteLock, Brivo, Salto KS, Veriff, Stripe) and exposes a partner-gated REST API
  at api.akia.com/v3 with OAuth 2.0 authorization, a published scope catalog, outbound
  webhook subscriptions, an embeddable web chat and partner embed SDK, and a remote
  MCP server at sys.akia.ai/mcp for agent access.'
