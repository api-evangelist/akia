apis:
- aid: akia:akia-api
  name: Akia API
  description: 'Akia''s REST API (version 3, with version 4 resources for mini apps
    and reservations) for creating and searching customers and reservations, sending
    guest messages, reading properties, generating and reading mini-app and agreement
    sessions, posting team-chat messages, building audiences and running reports.
    Authorization is OAuth 2.0 (RFC 6749) authorization-code with refresh tokens and
    a published scope catalog. Access is granted to select partners on request via
    partnerships@akia.com.'
  humanURL: https://api.akia.com/docs
  baseURL: https://api.akia.com/v3/
  tags:
  - Guest Messaging
  - Reservations
  - Customers
  - Hospitality
  x-evidence:
    verified: '2026-08-06'
    method: fetched-docs
    docs_url: https://api.akia.com/docs
    docs_http_status: 200
    documents: 'Server-rendered developer reference listing 30 operations across
      Audience, Context, Customer, Mini Apps, Properties, Report, Reservations and
      Team Chat, each with method, path, required scope, request and response
      parameter tables and a JSON example.'
    base_url_source: 'Documented on https://api.akia.com/docs — "All calls in this
      documentation expect either GET or POST requests made against the following
      base URL: https://api.akia.com/v3/"'
    access: 'Partner-gated — "Access to Akia''s API is currently available to select
      partners. Please reach out to partnerships@akia.com if you have a request."'
    machine_readable_spec: 'none published — /openapi.json, /openapi.yaml,
      /swagger.json, /v1/openapi.json, /api-docs, /redoc on api.akia.com all return
      the SPA login shell (HTTP 200, text/html)'
  properties:
  - type: Documentation
    url: https://api.akia.com/docs
  - type: APIReference
    url: https://api.akia.com/docs
  - type: GettingStarted
    url: https://api.akia.com/docs/introduction
  - type: Authentication
    url: https://api.akia.com/docs/authentication
  - type: OAuthScopes
    url: https://api.akia.com/docs/scopes
  - type: RateLimits
    url: https://api.akia.com/docs/rate_limits
  - type: Webhooks
    url: https://api.akia.com/docs/webhooks
- aid: akia:akia-mcp
  name: Akia MCP Server
  description: 'Akia''s remote Model Context Protocol server, advertised through RFC
    9728 OAuth protected-resource metadata at api.akia.com and sys.akia.com. The
    endpoint requires a Bearer token issued by the Akia authorization server at
    sys.akia.ai, which supports dynamic client registration (RFC 7591) and PKCE S256.
    The advertised resource scopes are customers:read and messages:read.'
  humanURL: https://api.akia.com/docs
  baseURL: https://sys.akia.ai/mcp
  tags:
  - MCP
  - Agents
  x-evidence:
    verified: '2026-08-06'
    method: probed
    url: https://sys.akia.ai/mcp
    http_status: 401
    www_authenticate: 'Bearer resource_metadata="https://sys.akia.ai/.well-known/oauth-protected-resource"'
    note: 'tools/list and initialize both return 401 with an RFC 9728 challenge — the
      server is genuinely published but the tool schemas require an authenticated
      introspection.'
  properties:
  - type: MCPServer
    url: mcp/akia-mcp.yml
  - type: Authentication
    url: authentication/akia-authentication.yml
