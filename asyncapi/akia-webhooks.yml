asyncapi_note: Akia publishes no AsyncAPI document. The webhook catalog below is transcribed from the
  provider's server-rendered HTML reference; no per-event payload schema, no event-name/topic identifier,
  and no signature-verification scheme are published, so an AsyncAPI cannot be derived from it without
  inventing channels and message schemas.
delivery:
  subscription: Webhooks are subscribed to in the Akia interface, not through the API. Relevant OAuth
    scopes must be requested in the auth dialog for the webhook to fire correctly.
  timeout_ms: 1500
  expected_response: HTTP 200
  retry: Anything other than a successful 200 is retried over the course of 24 hours with increasing intervals.
  auto_unsubscribe: Endpoints that result in too many failures are automatically unsubscribed.
  signature_verification: null
  signature_note: No signing secret, HMAC header, or replay-protection mechanism is documented.
events:
- name: Behavior Detection
  description: Receive payloads from customers who send messages that have their intent flagged by Akia.
  kind: platform
- name: Guest Message Created
  description: Fires for every inbound guest message.
